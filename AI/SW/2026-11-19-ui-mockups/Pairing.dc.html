<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pair a computer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #0A66D8;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#C9CBD3;font-family:Inter,-apple-system,system-ui,sans-serif;color:#0B0B0F">
<div role="dialog" aria-label="Pair a computer" style="position:absolute;top:56px;left:8px;right:8px;bottom:8px;border-radius:38px;background:rgba(248,248,251,.95);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 -6px 30px rgba(0,0,0,.12);display:flex;flex-direction:column;padding:10px 22px 22px">
<div aria-hidden="true" style="align-self:center;width:38px;height:5px;border-radius:3px;background:#C7C7CC"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;min-height:44px">
<a href="Devices.dc.html" style="height:36px;padding:0 16px;border-radius:18px;background:rgba(118,118,128,.14);color:#0B0B0F;font-size:15px;font-weight:600;display:flex;align-items:center;text-decoration:none">Cancel</a>
<span style="font-size:15px;color:#5B5B66">Step 2 of 2</span>
</div>

<h2 style="margin:26px 0 0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.5px">Check the words match</h2>
<p style="margin:10px 0 0;font-size:16px;line-height:1.45;color:#3C3C43">Studio PC shows four words too. If they're the same, this phone is talking to your computer and no one else.</p>

<ol style="margin:28px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<li style="height:76px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;letter-spacing:-.3px">maple</li>
<li style="height:76px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;letter-spacing:-.3px">river</li>
<li style="height:76px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;letter-spacing:-.3px">copper</li>
<li style="height:76px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;letter-spacing:-.3px">orbit</li>
</ol>

<div style="margin-top:22px;border-radius:20px;background:#fff;min-height:64px;display:flex;align-items:center;gap:12px;padding:0 16px">
<span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">Let this phone run agents here</span><span style="font-size:14px;color:#5B5B66">Off: the computer only types your words</span></span>
<button role="switch" aria-checked="false" aria-label="Let this phone run agents on Studio PC" style="flex:none;width:52px;height:32px;border-radius:16px;border:0;background:#E5E5EA;position:relative;padding:0"><span aria-hidden="true" style="position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)"></span></button>
</div>

<div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
<button style="height:56px;border-radius:28px;border:0;background:#0A66D8;color:#fff;font-size:17px;font-weight:600;box-shadow:0 10px 24px rgba(10,102,216,.30)">The words match</button>
<button style="height:52px;border-radius:26px;border:0;background:rgba(118,118,128,.12);color:#D70015;font-size:17px;font-weight:600">They don't match</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
