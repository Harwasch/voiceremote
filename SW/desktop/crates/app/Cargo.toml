[package]
name = "voiceremote-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "voiceremote"
path = "src/main.rs"

[features]
default = []
# Local integration only: fixed synthetic TextInjector and loopback HTTP relay.
e2e-test = []
os-keychain = ["voiceremote-core/os-keychain"]
# Reserved for the later tray implementation; no Tauri dependency.
tray = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
qrcode = { version = "0.14", default-features = false }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "io-util"] }
voiceremote-core = { path = "../core" }
voiceremote-agents = { path = "../agents" }
voiceremote-protocol = { path = "../protocol" }

[target.'cfg(windows)'.dependencies]
voiceremote-inject-windows = { path = "../inject-windows" }
async-trait = "0.1"
if-addrs = "0.13"
mdns-sd = "0.13"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }

[dev-dependencies]
voiceremote-inject-windows = { path = "../inject-windows" }
tempfile = "3"
zeroize = "1.8"
async-trait = "0.1"
if-addrs = "0.13"
mdns-sd = "0.13"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28"
