[package]
name = "voiceremote-agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
sha2 = "0.10"
if-addrs = "0.13"
mdns-sd = "0.13"
socket2 = { version = "0.6", features = ["all"] }
tokio-tungstenite = "0.28"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
voiceremote-core = { path = "../core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
