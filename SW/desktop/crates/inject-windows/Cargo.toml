[package]
name = "voiceremote-inject-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
voiceremote-core = { path = "../core" }
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Com",
    "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemInformation",
    "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_Variant", "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi", "Win32_UI_Controls",
] }

[[example]]
name = "desktop-smoke"
path = "examples/desktop-smoke.rs"
