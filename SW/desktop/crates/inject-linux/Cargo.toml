[package]
name = "voiceremote-inject-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "clipboard", "screencast"] }
enumflags2 = "0.7"
evdev = "0.13"
futures-util = "0.3"
libc = "0.2"
serde_json = "1"
reis = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "sync", "process"] }
tracing = "0.1"
voiceremote-core = { path = "../core" }
xkbcommon-dl = "0.4"
x11rb = { version = "0.13", features = ["xtest", "xkb"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
