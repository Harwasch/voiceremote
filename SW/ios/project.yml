name: VoiceRemote
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    BUNDLE_ID_PREFIX: com.harwasch.voiceremote
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    VOICE_REMOTE_PUSH_ENVIRONMENT: ""
    VOICE_REMOTE_APP_ENTITLEMENTS: Configuration/AppGroup.entitlements
    SUPPORTS_MACCATALYST: NO
packages:
  Core:
    path: Packages/Core
  Stt:
    path: Packages/Stt
  SttApple:
    path: Packages/SttApple
  Brain:
    path: Packages/Brain
  KeyboardBridge:
    path: Packages/KeyboardBridge
  BrainApple:
    path: Packages/BrainApple
  Protocol:
    path: Packages/Protocol
  AppModel:
    path: Packages/AppModel
  Policy:
    path: Packages/Policy
  Router:
    path: Packages/Router
  Pairing:
    path: Packages/Pairing
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 4.0.0
  SwiftOpus:
    url: https://github.com/alta/swift-opus.git
    exactVersion: 0.0.2
targets:
  VoiceRemote:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [README.md, Push.entitlements]
      - path: LiveActivity/ListeningAttributes.swift
      - path: ../bench/sets/phrases.json
        buildPhase: resources
      - path: Configuration/Assets.xcassets
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: $(VOICE_REMOTE_APP_ENTITLEMENTS)
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: Voice Remote
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio, bluetooth-central, remote-notification, fetch]
        VoiceRemotePushEnvironment: $(VOICE_REMOTE_PUSH_ENVIRONMENT)
        BGTaskSchedulerPermittedIdentifiers: [com.harwasch.voiceremote.audit-refresh]
        NSMicrophoneUsageDescription: Turn speech into text for the destination you choose. Audio is only saved in the benchmark recorder.
        NSSpeechRecognitionUsageDescription: Transcribe your speech for dictation and reviewed commands.
        NSCameraUsageDescription: Scan a computer's pairing QR code. You can paste the code instead.
        NSBluetoothAlwaysUsageDescription: Connect your voice remote microphone and show its recording state.
        NSLocalNetworkUsageDescription: Find and pair your computers without entering an IP address.
        NSBonjourServices: [_voiceremote._tcp]
        NSFaceIDUsageDescription: Approve the exact sensitive action shown on your iPhone.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: AppModel
      - package: Protocol
        product: VoiceRemoteProtocol
      - package: Policy
      - package: Router
      - package: Pairing
      - package: KeyboardBridge
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftOpus
        product: Copus
      - package: Core
      - package: Stt
      - package: SttApple
      - package: Brain
      - package: BrainApple
      - target: KeyboardExt
        embed: true
      - target: LiveActivity
        embed: true
  KeyboardExt:
    dependencies:
      - package: KeyboardBridge
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExt
        excludes: [README.md]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).keyboard
        CODE_SIGN_ENTITLEMENTS: Configuration/AppGroup.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Configuration/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: Voice Remote Keyboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
  LiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
        excludes: [README.md]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).liveactivity
        CODE_SIGN_ENTITLEMENTS: Configuration/AppGroup.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Configuration/LiveActivity-Info.plist
      properties:
        CFBundleDisplayName: Voice Remote Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  VoiceRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [README.md]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VoiceRemote
  VoiceRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: [README.md, DemoAdapterProbe.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VoiceRemote
schemes:
  VoiceRemote:
    build:
      targets:
        VoiceRemote: all
    test:
      targets: [VoiceRemoteTests]
      gatherCoverageData: true
    archive:
      config: Release
  VoiceRemoteUI:
    build:
      targets:
        VoiceRemote: all
    test:
      config: Debug
      targets: [VoiceRemoteUITests]
      gatherCoverageData: false
