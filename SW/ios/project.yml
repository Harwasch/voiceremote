name: VoiceRemote
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    BUNDLE_ID_PREFIX: com.harwasch.voiceremote
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
packages:
  Core:
    path: Packages/Core
  Stt:
    path: Packages/Stt
  SttApple:
    path: Packages/SttApple
  Brain:
    path: Packages/Brain
  KeyboardBridge:
    path: Packages/KeyboardBridge
targets:
  VoiceRemote:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [README.md]
      - path: Configuration/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/AppGroup.entitlements
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: Voice Remote
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: Core
      - package: Stt
      - package: SttApple
      - package: Brain
      - target: KeyboardExt
        embed: true
      - target: LiveActivity
        embed: true
  KeyboardExt:
    dependencies:
      - package: KeyboardBridge
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExt
        excludes: [README.md]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).keyboard
        CODE_SIGN_ENTITLEMENTS: Configuration/AppGroup.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Configuration/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: Voice Remote Keyboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
  LiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
        excludes: [README.md]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).liveactivity
        CODE_SIGN_ENTITLEMENTS: Configuration/AppGroup.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Configuration/LiveActivity-Info.plist
      properties:
        CFBundleDisplayName: Voice Remote Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  VoiceRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [README.md]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VoiceRemote
schemes:
  VoiceRemote:
    build:
      targets:
        VoiceRemote: all
    test:
      targets: [VoiceRemoteTests]
      gatherCoverageData: true
    archive:
      config: Release
