[project]
name = "vr-bench"
version = "0.1.0"
description = "Offline speech and brain scoring for Voice Control Fabric"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.scripts]
vr-bench = "benchkit.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
