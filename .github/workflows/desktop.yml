name: Desktop
on:
  schedule:
    - cron: '23 9 * * *'
  push:
    tags:
      - 'desktop-v*'
      - 'desktop-ci-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_TEST_THREADS: 4
    defaults:
      run:
        working-directory: SW/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux protocol-double runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon libxkbcommon0 xkb-data
      - name: Test workspace
        run: cargo test --workspace -j4
      - name: Check OS keychain feature
        run: cargo check --workspace --features os-keychain -j4
  windows-injection-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RUST_TEST_THREADS: 4
    defaults:
      run:
        working-directory: SW/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint Windows injector
        run: cargo clippy -p voiceremote-inject-windows --no-deps --all-targets -j4 -- -D warnings
      - name: Test desktop acquisition outcomes
        run: cargo test -p voiceremote-inject-windows --example desktop-smoke -j4
      - name: Exercise an owned desktop edit control
        shell: pwsh
        run: |
          $output = & cargo run -p voiceremote-inject-windows --example desktop-smoke -j4 2>&1
          $result = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($result -ne 0) { exit $result }
          $status = $output | Where-Object { "$_" -match '^(PASS:|SKIPPED:)' }
          if (-not $status) { throw 'Smoke produced no PASS or SKIPPED status' }
          $status | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  linux-x11-injection:
    runs-on: ubuntu-latest
    env:
      RUST_TEST_THREADS: 4
      XDG_SESSION_TYPE: x11
    defaults:
      run:
        working-directory: SW/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install isolated X11 test server
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth dbus-daemon libxkbcommon0 xkb-data
      - name: Inject into X11 field, read back, preserve clipboard, reject Enter
        run: xvfb-run -a cargo test -p voiceremote-inject-linux --test x11_display -j4 -- --ignored --test-threads=1

  tray:
    name: Tray / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard release and bundle versions
        shell: python
        run: |
          import json, os, pathlib, tomllib
          root = pathlib.Path("SW/desktop")
          version = tomllib.loads((root / "Cargo.toml").read_text())["workspace"]["package"]["version"]
          bundle = json.loads((root / "crates/tray/tauri.conf.json").read_text())["version"]
          assert bundle == version, "Tauri bundle version differs from Cargo.toml"
          tag = os.environ["GITHUB_REF_NAME"]
          if tag.startswith("desktop-v"):
              assert tag == "desktop-v" + version, "release tag differs from Cargo.toml"
      - name: Install Linux tray build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Test plain tray logic
        working-directory: SW/desktop
        run: cargo test -p voiceremote-tray -j4
      - name: Check dependency licenses
        shell: bash
        working-directory: SW/desktop
        run: |
          cargo metadata --format-version 1 --all-features > "$RUNNER_TEMP/desktop-metadata.json"
          python - "$RUNNER_TEMP/desktop-metadata.json" <<'PY'
          import json, re, sys
          packages = json.load(open(sys.argv[1], encoding="utf-8"))["packages"]
          # Dual-licensed dependencies with a permissive alternative are usable.
          denied = []
          for package in packages:
              license = package.get("license") or ""
              if re.search(r"(?<!L)\bA?GPL-", license) and not re.search(r"\b(MIT|Apache-2.0|BSD-[23]-Clause|ISC|Zlib)\b", license):
                  denied.append(package["name"] + ": " + license)
          assert not denied, "GPL-only dependencies: " + ", ".join(denied)
          print("No GPL-only Cargo dependencies; native GTK/WebKit LGPL obligations remain.")
          PY
      - name: Import optional Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERT != ''
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PASSWORD) { throw 'WINDOWS_CERT_PASSWORD required with WINDOWS_CERT' }
          $path = Join-Path $env:RUNNER_TEMP 'voiceremote-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERT))
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if (-not $certificate) { throw 'Signing certificate has no private key' }
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } }
            $config | ConvertTo-Json -Depth 8 | Set-Content -Path 'SW/desktop/crates/tray/tauri.signing.conf.json'
            'TRAY_SIGNING_ARGS=--config tauri.signing.conf.json' | Out-File -FilePath $env:GITHUB_ENV -Append
          } finally { Remove-Item $path -Force }
      - name: Build the installed hotkey CLI
        working-directory: SW/desktop
        run: cargo build -p voiceremote-app --release --features os-keychain,tray -j4
      - name: Stage CLI sidecar for the native target
        shell: python
        run: |
          import pathlib, shutil, subprocess, sys
          root = pathlib.Path("SW/desktop")
          host = next(line.split(": ", 1)[1] for line in subprocess.check_output(["rustc", "-vV"], text=True).splitlines() if line.startswith("host: "))
          suffix = ".exe" if sys.platform == "win32" else ""
          destination = root / "crates/tray/binaries" / ("voiceremote-" + host + suffix)
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(root / "target/release" / ("voiceremote" + suffix), destination)
      - name: Build installers and attach draft release assets on release tags
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
        with:
          projectPath: SW/desktop/crates/tray
          args: --features gui --bundles ${{ matrix.bundles }} --config tauri.bundle.conf.json ${{ env.TRAY_SIGNING_ARGS }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: Voice Receiver ${{ github.ref_name }}
          releaseBody: Windows NSIS and Linux deb/AppImage. Native desktop and physical phone acceptance remain unverified. Unsigned Windows builds may trigger SmartScreen.
          releaseDraft: true
          prerelease: false
      - name: Retain installers for coordinator acceptance
        uses: actions/upload-artifact@v4
        with:
          name: voice-receiver-${{ matrix.os }}
          path: |
            SW/desktop/target/release/bundle/nsis/*.exe
            SW/desktop/target/release/bundle/deb/*.deb
            SW/desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
