name: Relay

on:
  schedule:
    - cron: '23 9 * * *'
  push:
    tags: ['relay-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.credentials.outputs.enabled }}
    defaults:
      run:
        working-directory: SW/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SW/relay/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce release tag version
        run: npm run check-version -- "$GITHUB_REF_NAME"
      - run: npm test
      - name: Bundle without deploying
        run: npm run build
      - name: Check deployment credential presence
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/relay-v* && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Deploy skipped: requires a relay-v tag and CLOUDFLARE_API_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/relay-v') && needs.test.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: SW/relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release commit accepted on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce release tag version again
        run: npm run check-version -- "$GITHUB_REF_NAME"
      - run: npm run deploy
